name: Deploy

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: docker
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        run: |
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt-get update
          apt-get install -y docker-ce-cli docker-buildx-plugin
      - name: Build the Docker Image
        run: |
          docker build --network=host -t blakerain/cement .
      - name: Login to Docker
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
      - name: Push the Image
        run: |
          docker push blakerain/cement:latest
          RELEASE_VERSION="${GITHUB_REF#refs/*/}"
          docker tag blakerain/cement:latest blakerain/cement:$RELEASE_VERSION
          docker push blakerain/cement:$RELEASE_VERSION
          docker push git.blakerain.com/blakerain/cement:$RELEASE_VERSION
